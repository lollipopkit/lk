[package]
name = "lk-cli"
description = "CLI for LK Language"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkt.cn>"]
license = "Apache-2.0"
default-run = "lk"

[[bin]]
name = "lk"
path = "src/main.rs"

[package.metadata.cargo-bin]
default-run = "lk"

[features]
default = ["aot", "stdlib"]
aot = ["dep:lk-aot"]
# TODO(migration): `llvm` is a compatibility alias kept for external callers of
# `--features llvm`; the backend has been Cranelift since #27. Delete it once
# downstream build scripts have moved to `aot`.
llvm = ["aot"]
stdlib = ["dep:lk-stdlib", "lk-completion/stdlib"]
vm-profile = ["lk-core/vm-profile"]

[dependencies]
lk-core = { path = "../core" }
lk-completion = { path = "../completion", default-features = false }
lk-aot = { path = "../aot/driver", optional = true }
lk-stdlib = { path = "../stdlib", optional = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
clap = { version = "4", features = ["derive"] }
reedline = "0.48"
nu-ansi-term = "0.50"
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = { workspace = true }

# `wait4` for the scope-drop test's peak-RSS measurement (tests/aot_scope_drop_test.rs).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
