[package]
name = "lk-bare-metal-x86"
description = "LK compiled to native x86-64 machine code, running with no OS"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkt.cn>"]
license = "Apache-2.0"
publish = false

[[bin]]
name = "lk-bare-metal-x86"
path = "src/main.rs"
test = false
bench = false

[features]
# Faults on purpose after the boot path is up, so CI can check that the
# exception reporter says what happened instead of the machine resetting
# silently. Never on for the ordinary build.
fault-probe = []

[dependencies]
# The rlib, not the staticlib: this binary supplies the allocator and panic
# handler itself. (`lkrt-cabi` is the archive the hosted AOT path links.)
lkrt = { path = "../lkrt", default-features = false }
# The interpreter, so the kernel can run a program it read off the disk. Same
# no_std build the Cortex-M demo uses; `stdlib/bare` supplies the module surface
# that works without an OS, with this kernel's own console as the output sink.
lk-core = { path = "../core", default-features = false }
lk-stdlib-bare = { path = "../stdlib/bare", default-features = false, features = ["math","string","bytes","iter","hash","encoding"] }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
