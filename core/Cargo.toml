[package]
name = "lk-core"
description = "Core library for LK"
version = "0.2.0"
edition = "2024"
authors = ["lollipopkit <a@lpkt.cn>"]
license = "Apache-2.0"

[lib]
name = "lk_core"
crate-type = ["rlib"]

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["std", "async-runtime"]
# `RuntimeVal`'s `PartialEq`, for test code only. The type cannot answer `==`
# correctly — equality of a heap value needs the heap — so production code has
# no `==` at all and asks `Executor::runtime_values_equal` or
# `lk_stdlib_common::runtime_native::runtime_values_equal` instead. A test
# compares against values it wrote down, which is a different question.
testing = []
# `std` gates the std-heavy, VM-core-independent modules (currently the
# `package` manager: Lk.toml/lock, git, filesystem). Disabling it is a step
# toward the no_std `lk-vm-core` split (plan M0.7/8): the VM core (token/ast/
# stmt/typ/vm/val/gc) does not depend on `package`, so it drops out cleanly.
std = [
    "dep:stacker",
    "dep:dashmap",
    "dep:toml",
    "dep:serde_yaml",
    "anyhow/std",
    "serde/std",
    "serde_json/std",
]
# tokio/futures are std-only, so this implies `std` rather than silently
# producing a configuration that cannot compile (`--no-default-features
# --features async-runtime` used to fail with 24 errors).
async-runtime = ["std", "dep:futures", "dep:tokio"]
vm-profile = []

[dependencies]
lk-values = { path = "../values" }
anyhow = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "rc", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde_yaml = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
rustc-hash = { version = "2", default-features = false }
# Segmented-stack growth for the recursive dispatch (rustc's own approach):
# deep LK recursion grows the stack instead of aborting. std-only.
stacker = { version = "0.1", optional = true }
# Pure-Rust float math for no_std (the inherent f64 methods live in std).
libm = { version = "0.2", default-features = false }
hashbrown = { version = "0.15", features = ["serde"] }
# Insertion-ordered value maps (`ValueMap`): a program's `Map` is one of these,
# so `println(m)` and `m.keys()` are functions of the value rather than of the
# hash layout. `default-features = false` keeps the no_std build available.
indexmap = { version = "2", default-features = false, features = ["serde"] }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "once"] }
itoa = { version = "1" }
ryu = { version = "1" }
arcstr = { workspace = true, features = ["serde"] }
