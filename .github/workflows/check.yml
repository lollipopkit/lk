name: Rust Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: ci checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain-file: rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: wasm32 smoke (L0 no_std crates + browser playground)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p lk-values --target wasm32-unknown-unknown
          cargo build -p lk-wasm --target wasm32-unknown-unknown
      - name: thumbv7em MCU smoke (bare + alloc L0 profiles on bare-metal ARM)
        # Proves the L0 foundations cross-compile to a real Cortex-M MCU target
        # (no OS, no allocator provided): lk-values is the `alloc` profile
        # (plan M5.1 profiles / M5.2 MCU smoke).
        run: |
          rustup target add thumbv7em-none-eabi
          cargo build -p lk-values --target thumbv7em-none-eabi
          # Full VM core on bare metal (M5.2): parser/compiler/verifier/
          # executor/GC build with no std anywhere in the crate graph.
          cargo build -p lk-core --no-default-features --target thumbv7em-none-eabi
          # The computation-only stdlib modules must cross-compile too, each
          # on its own: a crate that only builds because a sibling happened to
          # enable `std` for it is not actually no_std.
          for m in bytes encoding hash iter math slice string; do
            cargo build -p "lk-stdlib-$m" --no-default-features --target thumbv7em-none-eabi
          done
          cargo build -p lk-stdlib-bare --target thumbv7em-none-eabi
          # A no_std stdlib crate must not assume lk-core is also no_std:
          # feature unification can give lk-core `std` while the crate itself
          # stays no_std. Building one of each together is what catches it —
          # `--workspace` does not, because there the union enables `std`
          # everywhere.
          cargo check -p lk-stdlib-bare -p lk-stdlib-string
      - name: bare-metal QEMU smoke (LK actually runs with no OS)
        # Building for thumbv7em proves the code compiles; it does not prove the
        # VM works without std. This boots a real Cortex-M image under QEMU,
        # runs an LK program through parse → type-check → execute, and checks
        # the answer. LK's own `println` goes through stdlib/bare to
        # semihosting, so the module surface is exercised too. A wrong answer or
        # a raise exits non-zero.
        run: |
          rustup target add thumbv7em-none-eabi
          sudo apt-get update && sudo apt-get install -y qemu-system-arm
          # Regenerate the bytecode the artifact-only probe embeds. `.lkm` is
          # build-locked, so a committed one goes stale the moment the artifact
          # version is bumped; generating it here keeps the probe honest
          # instead of failing for an unrelated reason.
          cargo run -p lk-cli --no-default-features --features stdlib -- \
            compile bytecode bare-metal/demo.lk
          cd bare-metal
          cargo build --release
          # Assert on the output, not just the exit status: if semihosting
          # silently stopped working the program would print nothing and still
          # exit 0. The timeout is because a fault parks the core in `wfi`
          # rather than exiting, which would otherwise hang the job.
          assert_printed() {
            printf '%s' "$1" | grep -qF -- "$2" || {
              echo "::error::$3 did not print: $2"
              exit 1
            }
          }
          for image in lk-bare-metal artifact_only; do
            if ! output=$(timeout 120 qemu-system-arm -cpu cortex-m4 -machine mps2-an386 -nographic \
                -semihosting-config enable=on,target=native \
                -kernel "target/thumbv7em-none-eabi/release/$image" 2>&1); then
              echo "$output"
              echo "::error::$image failed or timed out"
              exit 1
            fi
            echo "$output"
            # One line per module surface, so a module silently dropping out of
            # the registry fails here instead of passing quietly.
            case "$image" in
              # A UART driver written in LK: it configures the device, polls
              # its status register and transmits. The text arriving on the
              # serial line is the proof that volatile MMIO reaches hardware —
              # semihosting is not involved in producing it.
              lk-bare-metal)
                assert_printed "$output" "LK drives hardware" "$image"
                # Each '.' is a SysTick interrupt firing, from a timer the LK
                # code armed itself. Three in a row means the interrupt
                # controller was programmed correctly and is running free —
                # a single one could be a fluke of ordering.
                assert_printed "$output" "..." "$image"
                ok="OK: lk ran on bare metal, returned 0"
                ;;
              # The language-feature corpus, run from precompiled bytecode.
              artifact_only)
                assert_printed "$output" "sum(fib(0..9)) = 88" "$image"
                assert_printed "$output" "sqrt(144) = 12" "$image"
                assert_printed "$output" "upper = BARE METAL" "$image"
                assert_printed "$output" "bytes.len = 2" "$image"
                assert_printed "$output" "doubled = [2,4,6]" "$image"
                assert_printed "$output" "crc32 = 1391562372" "$image"
                assert_printed "$output" "json.n = 42" "$image"
                assert_printed "$output" "base64 = bGs=" "$image"
                assert_printed "$output" "hex = 6c6b" "$image"
                ok="OK: artifact ran on bare metal, returned 88"
                ;;
              *) echo "::error::unknown image $image"; exit 1 ;;
            esac
            assert_printed "$output" "$ok" "$image"
          done
      - name: aarch64 native bare-metal QEMU smoke (compiled LK, no OS)
        # The step above runs LK's *interpreter* on a board. This one runs its
        # *compiled output*: `lk compile object:aarch64-unknown-none` emits a
        # relocatable object, an ordinary embedded build links it, and the
        # resulting image drives a PL011 UART from a driver written in LK. It
        # catches what neither the differential tests nor the coverage gate can
        # — that the cross-compiled object actually links and executes on a
        # target the host is not.
        run: |
          rustup target add aarch64-unknown-none
          sudo apt-get update && sudo apt-get install -y qemu-system-arm clang
          cargo build -p lkrt-cabi
          cargo build -p lk-cli --features aot
          cd bare-metal-native
          # Cleared, not inherited: the toolchain action sets `RUSTFLAGS=-D
          # warnings` for the whole job, and a `RUSTFLAGS` environment variable
          # *replaces* the crate's `.cargo/config.toml` rustflags table rather
          # than extending it. What that table carries is not style — it is
          # `link-dead-code`, without which the image does not link.
          RUSTFLAGS= LK_BIN=../target/debug/lk cargo build --release
          # A fault parks the core rather than exiting, so the timeout is what
          # turns a hang into a failure.
          output=$(timeout 120 qemu-system-aarch64 -M virt -cpu cortex-a53 \
            -display none -serial stdio \
            -kernel target/aarch64-unknown-none/release/lk-bare-metal-native 2>&1 || true)
          echo "$output"
          # The first line comes out of LK's own PL011 driver — compiled
          # `volatile_write_u32` against 0x0900_0000, no runtime involved. The
          # last proves control returned from compiled code to the board.
          # The '...' are timer interrupts handled by an LK function: three in
          # a row means the GIC, the timer and the exported handler are all
          # working, where one could be a fluke of ordering. The headline is
          # intact because `program.lk` masks interrupts around it — an
          # unprotected line would have dots spliced into it.
          for expected in \
            "native LK drives the PL011: sum(fib(0..9)) = 88" \
            "..." \
            "[lk returned to the board, status 0000000000000000]"; do
            printf '%s' "$output" | grep -qF -- "$expected" || {
              echo "::error::aarch64 native image did not print: $expected"
              exit 1
            }
          done
      - name: x86-64 native bare-metal QEMU smoke (port I/O, no OS)
        # The aarch64 image proves compiled LK drives a memory-mapped device.
        # x86 devices are not memory-mapped — they answer to `in`/`out` in a
        # separate address space — so this is the only thing that exercises the
        # `port_*` intrinsics end to end, from type check through lowering to
        # instructions a machine actually executes.
        run: |
          rustup target add x86_64-unknown-none
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 llvm
          cargo build -p lk-cli --features aot
          cd bare-metal-x86
          # Same reason as the aarch64 step: this crate's rustflags table
          # carries `relocation-model=static` and the float-ABI override, and a
          # job-wide `RUSTFLAGS` would replace it. `src/main.rs` also refuses to
          # compile without SSE, so a future step that forgets this says why.
          export RUSTFLAGS=
          # `isa-debug-exit` makes the machine exit when the kernel is done, so
          # a hang is a timeout rather than a pass; its exit code for a clean
          # run is 1, hence the `|| true`.
          output=$(timeout 120 ./run.sh 2>&1 || true)
          echo "$output"
          # `half 44` is a f64 round trip across the LK/lkrt boundary: this
          # target is soft-float by default, and a mismatch there prints 88
          # rather than failing. `pixels` is read back out of the device's own
          # memory — the background and a lit pixel of the title, so it also
          # says the font renderer drew. The '...' are timer interrupts handled
          # by an LK function — three in a row, where one could be a fluke.
          for expected in \
            "display at pci slot" \
            "framebuffer 0xfd000000" \
            "half 44" \
            "pixels 00001428 00ffc040" \
            "..." \
            "[lk returned to the board]"; do
            printf '%s' "$output" | grep -qF -- "$expected" || {
              echo "::error::x86-64 native image did not print: $expected"
              exit 1
            }
          done
          # A build that faults on purpose. Without it a broken exception
          # reporter looks exactly like a working one — the machine would
          # simply reset in silence, which is the failure mode with the least
          # information possible.
          faulted=$(CARGO_FLAGS=--features=fault-probe timeout 120 ./run.sh 2>&1 || true)
          echo "$faulted"
          printf '%s' "$faulted" | grep -qF -- "#PF page fault" || {
            echo "::error::the exception reporter did not name the fault"
            exit 1
          }
          printf '%s' "$faulted" | grep -qF -- "cr2=0000000900000000" || {
            echo "::error::the exception reporter did not report the faulting address"
            exit 1
          }
          # Reading the framebuffer back proves the writes reached the device's
          # memory; it does not prove the mode was set, because an unconfigured
          # card still accepts them. Only what QEMU scans out shows that.
          LK_BIN=../target/debug/lk cargo build --release
          llvm-objcopy -O elf32-i386 \
            target/x86_64-unknown-none/release/lk-bare-metal-x86 \
            target/x86_64-unknown-none/release/lk-bare-metal-x86.multiboot
          timeout 120 python3 check_screen.py
          # The input half, end to end: `sendkey` puts real scancodes into the
          # emulated PS/2 controller, the LK handler decodes them into a line,
          # and the shell answers. It also checks the screen scrolled rather
          # than wrapped, which the serial line cannot show.
          timeout 250 python3 check_shell.py
          # Two tasks, one of which never yields: the timer takes the CPU away
          # from it. Checked on screen rather than on the serial line, because
          # interleaved output would show that both ran, not that either was
          # interrupted mid-work.
          timeout 200 python3 check_tasks.py
          # Which window has the keyboard, made visible. Each window repaints
          # its own frame on its own turn — the key handler that moved the
          # focus only writes a word, because drawing from an interrupt would
          # put a window's appearance in the hands of whatever it interrupted.
          timeout 200 python3 check_focus.py
          # A real block device: IDENTIFY, a sector read, a sector write. The
          # third assertion is the one that needs the machine stopped — after
          # QEMU exits, the image *file* must hold what was written, because a
          # drive acknowledges a write long before it is on the medium.
          timeout 300 python3 check_disk.py
          # The kernel is compiled LK; this checks that it also *hosts an
          # interpreter* for LK. The program it runs is not in the image — it
          # is read off the disk — and neither the answer nor the loop that
          # computes it appears anywhere in the kernel.
          timeout 400 python3 check_run.py
          # The PS/2 mouse: three-byte packets on the keyboard's controller,
          # IRQ12 through the slave PIC's cascade. Checked on the screen — the
          # cursor follows and leaves no trail — and by what a click does, which
          # is hand the keyboard to the window under it.
          timeout 300 python3 check_mouse.py
        env:
          LK_BIN: ../target/debug/lk
      - name: AOT native-lowering coverage gate
        # A lowering regression does not fail any differential test: the
        # program silently drops to the hybrid bridge or the Tier 0 VM bundle
        # and still produces correct output, just ~3x slower. This scan (hybrid
        # pinned off, no fallback) is the only thing that catches it. Add a
        # file to AOT_COVERAGE_ALLOW if it legitimately cannot lower.
        run: |
          cargo build -p lk-cli --features aot
          # 48/51. The three allowed files are the try/catch corpus: `try`/`catch`
          # became a real statement (`Stmt::Try` → `TryBegin`/`TryEnd`) to fix
          # three silent wrong answers on the VM path, and the MIR lowering has no
          # handler-region support yet, so they degrade to the Tier 0 VM bundle.
          # Output stays VM-identical (see `try_catch_differential` in
          # cli/tests/clif_differential_test.rs); what lapses is *native*
          # lowering. Drop these entries when the region outlining lands —
          # see todos.md.
          AOT_COVERAGE_REQUIRE_FULL=1 \
          AOT_COVERAGE_ALLOW=examples/syntax/try_catch.lk,examples/syntax/error_unwrap.lk,examples/syntax/error_model_edges.lk \
          bash scripts/aot_coverage.sh
      - name: strict native-only differential (no Tier 0 fallback)
        # Complements the scan above: the corpora must not just *compile*
        # native, they must produce VM-identical output while pinned to the
        # native path.
        run: LK_AOT_NO_FALLBACK=1 cargo test -p lk-cli --test aot_differential_test --test clif_differential_test
      - name: lk-core builds and *tests* as no_std (VM core no-std guard)
        # `--no-default-features` drops the `std` feature, which now makes
        # lk-core `#![no_std]` (+ alloc). The VM core (token/ast/expr/stmt/typ/
        # val/vm/gc/resolve/macro-expansion) compiles without std; std-only
        # leaves (package manager, file imports, proc-macro processes, fs-based
        # macro/module resolution, tokio) are `std`-feature-gated. This guards
        # the no_std profiles (plan M0.7/8, M5.1).
        #
        # Running the tests — not just building the lib — is the point: until
        # this ran, the no_std configuration's *behaviour* had never been
        # executed once, only type-checked. The no_std-only branches (spin
        # Mutex for std Mutex, the fs-less resolver, gc-stress off) had zero
        # coverage. libtest is std-only, so the test build links std as
        # scaffolding (see the `extern crate std` in core/src/lib.rs); every
        # non-test item is still compiled `#![no_std]`.
        run: cargo test -p lk-core --no-default-features
      - name: lk-core feature matrix
        # `cargo test --all-features` and the no_std build above only exercise
        # the two endpoints. The combinations in between drift unnoticed: until
        # `async-runtime` was made to imply `std`, enabling it alone failed with
        # 24 errors, because tokio/futures cannot build without std.
        run: |
          cargo check -p lk-core --no-default-features
          cargo check -p lk-core --no-default-features --features std
          cargo check -p lk-core --no-default-features --features async-runtime
          cargo check -p lk-core --no-default-features --features std,async-runtime
