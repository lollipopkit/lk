[package]
name = "lk-aot"
description = "AOT driver for LK: MIR pipeline orchestration and native linking"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkt.cn>"]
license = "Apache-2.0"

[lib]
name = "lk_aot"

[dependencies]
# `std` was previously pulled in implicitly through the (unused) `lk-stdlib`
# dependency; the driver reads `lk_core::vm` types and needs it directly.
lk-core = { path = "../../core", default-features = false, features = ["std", "async-runtime"] }
lk-aot-mir = { path = "../mir" }
lk-aot-lower = { path = "../lower" }
lk-aot-codegen = { path = "../codegen" }
lkrt = { path = "../../lkrt" }
anyhow = { workspace = true }

[dev-dependencies]
lk-aot-abi = { path = "../abi" }
