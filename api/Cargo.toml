[package]
name = "lk-api"
version = "0.1.0"
edition = "2024"

[lib]
name = "lk_api"
# `lib` only — the C-ABI archive is `lk-api-cabi`'s job. Declaring `staticlib`
# here made every build that reached `lk-api` (i.e. every build of `lk-cli`)
# also emit a 172MB archive that only the AOT linker path opens.
crate-type = ["lib"]

[features]
ffi = []

[dependencies]
lk-core = { path = "../core" }
lk-stdlib = { path = "../stdlib" }
anyhow = { workspace = true }

[dev-dependencies]
# Conformance only (never a shipped link — the hybrid binary links lkrt and
# liblk_api.a side by side): pins the ffi module's LkDyn mirror against
# lkrt's real carrier so a drift fails at test time, not at runtime.
lkrt = { path = "../lkrt" }
