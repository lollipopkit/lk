[package]
name = "lk-stdlib-common"
description = "Shared runtime helpers for LK standard library modules"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkt.cn>"]
license = "Apache-2.0"

[features]
default = ["std"]
# Off => no_std + alloc, so the computation-only stdlib modules can be built
# for bare metal (see `stdlib/bare`).
std = ["lk-core/std", "anyhow/std"]

[dependencies]
lk-core = { path = "../../core", default-features = false }
lk-stdlib-macros = { path = "../macros" }
anyhow = { version = "1", default-features = false }
