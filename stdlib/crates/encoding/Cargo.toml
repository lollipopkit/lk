[package]
name = "lk-stdlib-encoding"
description = "Encoding and data format module for LK"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkt.cn>"]
license = "Apache-2.0"

[features]
default = ["std"]
# Off => no_std + alloc. Only json/base64/hex survive: YAML and TOML decoding
# is `std`-gated in lk-core itself, and `url` pulls in idna, which needs std.
std = [
    "lk-core/std",
    "lk-stdlib-common/std",
    "lk-stdlib-bytes/std",
    "anyhow/std",
    "serde_json/std",
    "dep:serde_yaml",
    "dep:toml",
    "dep:url",
]

[dependencies]
anyhow = { version = "1", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
lk-core = { path = "../../../core", default-features = false }
lk-stdlib-bytes = { path = "../bytes", default-features = false }
lk-stdlib-common = { path = "../../common", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde_yaml = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
url = { workspace = true, optional = true }
