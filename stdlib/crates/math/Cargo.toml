[package]
name = "lk-stdlib-math"
description = "LK standard library math module"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkt.cn>"]
license = "Apache-2.0"

[features]
default = ["std"]
# Off => no_std + alloc, so this module can be offered on bare metal.
std = ["lk-core/std", "lk-stdlib-common/std", "anyhow/std"]

[dependencies]
lk-core = { path = "../../../core", default-features = false }
lk-stdlib-common = { path = "../../common", default-features = false }
anyhow = { version = "1", default-features = false }
# Pure-Rust float maths for no_std (the inherent f64 methods live in std).
libm = { version = "0.2", default-features = false }

