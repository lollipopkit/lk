[package]
name = "lk-stdlib-bare"
description = "Bare-metal (no_std) standard library surface for LK"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkt.cn>"]
license = "Apache-2.0"

[lib]
name = "lk_stdlib_bare"
crate-type = ["rlib"]

[dependencies]
anyhow = { version = "1", default-features = false }
lk-core = { path = "../../core", default-features = false }
lk-stdlib-common = { path = "../common", default-features = false }
