[package]
name = "lk-stdlib-bare"
description = "Bare-metal (no_std) standard library surface for LK"
version = "0.1.3"
edition = "2024"
authors = ["lollipopkit <a@lpkt.cn>"]
license = "Apache-2.0"

[lib]
name = "lk_stdlib_bare"
crate-type = ["rlib"]

[features]
# Every module is opt-in: on an MCU flash is the scarce resource, so a
# board should pay only for what it imports. `default` is the full
# no_std-capable set; pick a subset with `default-features = false`.
default = ["bytes", "encoding", "hash", "iter", "math", "string"]
bytes = ["dep:lk-stdlib-bytes"]
# json/base64/hex only; yaml/toml/url need std.
encoding = ["dep:lk-stdlib-encoding"]
hash = ["dep:lk-stdlib-hash"]
iter = ["dep:lk-stdlib-iter"]
math = ["dep:lk-stdlib-math"]
string = ["dep:lk-stdlib-string"]

[dependencies]
anyhow = { version = "1", default-features = false }
lk-core = { path = "../../core", default-features = false }
lk-stdlib-common = { path = "../common", default-features = false }

# The computation-only modules. Everything needing an OS stays out; see
# UNSUPPORTED_MODULES in src/lib.rs.
lk-stdlib-bytes = { path = "../crates/bytes", default-features = false, optional = true }
lk-stdlib-encoding = { path = "../crates/encoding", default-features = false, optional = true }
lk-stdlib-hash = { path = "../crates/hash", default-features = false, optional = true }
lk-stdlib-iter = { path = "../crates/iter", default-features = false, optional = true }
lk-stdlib-math = { path = "../crates/math", default-features = false, optional = true }
lk-stdlib-string = { path = "../crates/string", default-features = false, optional = true }
